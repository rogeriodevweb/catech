<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CA Tech</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"
        rel="stylesheet">
        <!--imagem da logo pro navegador-->
<link rel="icon" type="image/png" href="../assets/logo-com-fundo.png">

<link rel="stylesheet" href="/style/cadastro-endereco.css">
</head>
<body>
<a href="../index.html" class="btn-voltar">
    ← Voltar
</a>
<div class="container">

    <h2>Cadastro de Endereço</h2>

    <form id="formEndereco">

        <div class="campo">
            <label>CEP</label>
            <input type="text" id="cep" maxlength="9" placeholder="00000-000">
        </div>

        <div class="campo">
            <label>Rua</label>
            <input type="text" id="rua">
        </div>

        <div class="linha">

            <div class="campo">
                <label>Número</label>
                <input type="text" id="numero">
            </div>

            <div class="campo">
                <label>Complemento</label>
                <input type="text" id="complemento">
            </div>

        </div>

        <div class="campo">
            <label>Bairro</label>
            <input type="text" id="bairro">
        </div>

        <div class="linha">

            <div class="campo">
                <label>Cidade</label>
                <input type="text" id="cidade">
            </div>

            <div class="campo">
                <label>Estado</label>

                <select id="estado">
                    <option value="">Selecione</option>

                    <option>AC</option>
                    <option>AL</option>
                    <option>AP</option>
                    <option>AM</option>
                    <option>BA</option>
                    <option>CE</option>
                    <option>DF</option>
                    <option>ES</option>
                    <option>GO</option>
                    <option>MA</option>
                    <option>MT</option>
                    <option>MS</option>
                    <option>MG</option>
                    <option>PA</option>
                    <option>PB</option>
                    <option>PR</option>
                    <option>PE</option>
                    <option>PI</option>
                    <option>RJ</option>
                    <option>RN</option>
                    <option>RS</option>
                    <option>RO</option>
                    <option>RR</option>
                    <option>SC</option>
                    <option>SP</option>
                    <option>SE</option>
                    <option>TO</option>

                </select>

            </div>

        </div>

        <button type="submit">
            Salvar Endereço
        </button>

    </form>

</div>

<script src="/script.js"></script>

</body>
</html>
