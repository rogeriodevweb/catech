<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CA Tech - Carrinho</title>


    <link rel="stylesheet" href="../style/carrinho.css">


    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>


    <link
        href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&display=swap"
        rel="stylesheet">


    <link 
    rel="icon" 
    type="image/png" 
    href="../assets/logo-com-fundo.png">


</head>


<body>



<section class="carrinho">


    <h1>
        Meu Carrinho
    </h1>



    <!-- PRODUTOS ADICIONADOS PELO JS -->

    <div class="lista-carrinho">


        <!-- 
            O carrinho.js
            irá adicionar os produtos aqui
        -->


    </div>



</section>






<!-- CUPOM -->

<div class="cupom">


    <input
    type="text"
    placeholder="Digite o cupom de desconto">


    <button>

        Aplicar

    </button>


</div>








<!-- RESUMO -->

<div class="resumo">

    <h2>Resumo do Pedido</h2>

    <!-- Cupom -->
    <div class="cupom">

        <input
            type="text"
            id="cupom"
            placeholder="Digite seu cupom">

        <button id="aplicar-cupom">
            Aplicar
        </button>

    </div>

    <div class="linha">
        <span>Subtotal</span>
        <span id="subtotal">R$ 0,00</span>
    </div>

    <div class="linha">
        <span>Frete</span>
        <span id="frete">R$ 0,00</span>
    </div>

    <div class="linha">
        <span>Desconto</span>
        <span id="desconto">R$ 0,00</span>
    </div>

    <hr>

    <div class="linha total">
        <strong>Total</strong>
        <strong id="total">R$ 0,00</strong>
    </div>

    <button class="finalizar">
        Finalizar Compra
    </button>

</div>





    <hr>





    <div class="linha total">


        <span>
            Total
        </span>


        <span id="total">
            R$ 0,00
        </span>


    </div>



</div>









<!-- BOTÕES -->

<div class="acoes">


    <button class="continuar">

        Continuar Comprando

    </button>



    <button class="finalizar">

        Finalizar Compra

    </button>



</div>







<script src="../js/carrinho.js"></script>


</body>


</html>
