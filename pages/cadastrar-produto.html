<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CA Tech - Cadastrar Produto</title>


    <link rel="stylesheet" href="../style/cadastrar-produto.css">


    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&display=swap" rel="stylesheet">


     <!--imagem da logo pro navegador-->
    <link rel="icon" type="image/png" href="../assets/logo-com-fundo.png">
    


</head>



<body>



    <!-- MENU LATERAL -->

    <div class="sidebar">

        <!-- menu do lojista -->

    </div>





    <!-- CONTEÚDO -->

    <main class="conteudo">
        
        <div class="area-voltar">

        <a href="/pages/home-lojista.html" class="btn-voltar">
            ← Voltar
        </a>

    </div>


        <section class="cadastraproduto">



            <!-- TOPO -->

            <header class="topo-cadastraproduto">


                <div>

                    <h1>
                        Cadastrar Produto
                    </h1>


                    <p>
                        Adicione um novo produto ao catálogo da sua loja.
                    </p>


                </div>




            </header>






            <form 
    id="formProduto"
    enctype="multipart/form-data">

    <!-- Campo oculto da loja -->
    <input
        type="hidden"
        id="loja_idLoja"
        name="loja_idLoja"
        value="1">

    <!-- INFORMAÇÕES BÁSICAS -->

    <div class="secao">


        

        <h2>
            Informações do Produto
        </h2>

        <div class="campo">

            <label>
                Nome do Produto
            </label>

            <input
                type="text"
                id="nome"
                name="nome"
                placeholder="Ex: SSD Kingston 480GB">

        </div>

        <div class="linha">

            <div class="campo">

    <label>
        Categoria
    </label>

    <select
    id="categorias_idCategorias"
    name="categorias_idCategorias">

    <option value="">
        Selecione uma categoria
    </option>

</select>
</div>

  <div class="campo">

    <label>Marca</label>

    <select
    id="marca_idMarca"
    name="marca_idMarca">

    <option value="">
        Selecione uma marca
    </option>

</select>

</div>

            </div>

        </div>
        <!-- CADASTRAR NOVA CATEGORIA -->
<div class="campo">

    <label>
        Nova Categoria
    </label>

    <div class="linha-categoria">

        <input
            type="text"
            id="novaCategoria"
            placeholder="Digite o nome da categoria">

        <button
            type="button"
            id="btnCategoria"
            class="btn-categoria">

            Cadastrar

        </button>

    </div>

</div>

<div class="campo">

    <label>Nova Marca</label>

    <div class="cadastro-marca">

        <input
            type="text"
            id="novaMarca"
            placeholder="Digite o nome da marca"
        >


        <button 
            type="button"
            onclick="cadastrarMarca()">

            Cadastrar

        </button>


    </div>

</div>
    </div>

    <!-- PREÇOS -->

    <div class="secao">

        <h2>
            Valores e Estoque
        </h2>

        <div class="linha">

            <div class="campo">

                <label>
                    Preço
                </label>

                <input
                    type="number"
                    id="preco_antigo"
                    name="preco_antigo"
                    step="0.01"
                    placeholder="R$ 0,00">

            </div>

            <div class="campo">

                <label>
                    Preço Promocional
                </label>

                <input
                    type="number"
                    id="preco_promocional"
                    name="preco_promocional"
                    step="0.01"
                    placeholder="R$ 0,00">

            </div>

        </div>

        <div class="linha">

            <div class="campo">

                <label>
                    Estoque
                </label>

                <input
                    type="number"
                    id="quantidade_estoque"
                    name="quantidade_estoque"
                    placeholder="Quantidade">

            </div>

            <div class="campo">

                <label>
                    SKU
                </label>

                <input
                    type="text"
                    id="codigo"
                    name="codigo"
                    placeholder="Código do produto">

            </div>

        </div>

    </div>

    <!-- DESCRIÇÃO -->

    <div class="secao">

        <h2>
            Descrição
        </h2>

        <div class="campo">

            <textarea
                id="descricao"
                name="descricao"
                placeholder="Descreva detalhes técnicos do produto..."></textarea>

        </div>

    </div>

    <!-- IMAGENS -->

    <div class="secao">

        <h2>
            Imagens do Produto
        </h2>

        <div class="linha">

            <div class="campo">

                <label>
                    Imagem Principal
                </label>

                <div class="upload">

                    <p>
                        Selecione a imagem principal
                    </p>

                    <input
                    type="file"
                    id="imagem_principal"
                    name="imagem"
                    accept="image/*">
                  </div>

            </div>

            <div class="campo">

                <label>
                    Galeria de Imagens
                </label>

                <div class="upload">

                    <p>
                        Adicione imagens adicionais
                    </p>

                    <input
                        type="file"
                        id="galeria_imagens"
                        name="galeria_imagens"
                        multiple>

                </div>

            </div>

        </div>

    </div>

    <!-- STATUS -->

    <div class="secao">

        <h2>
            Configurações
        </h2>

        <div class="campo">

            <label>
                Status do Produto
            </label>

            <select
                id="ativo"
                name="ativo">

                <option value="1">
                    Ativo
                </option>

                <option value="0">
                    Inativo
                </option>

            </select>

        </div>

    </div>

    <!-- BOTÕES -->

    <div class="botoes">

        <button
            type="button"
            class="btn-cancelar">

            Cancelar

        </button>

        <button
            type="submit"
            id="btn-salvar"
            class="btn-salvar">

            Salvar Produto

        </button>

    </div>

</form>



        </section>



    </main>







<script src="../js/cadastrar-produto.js"></script>


</body>

</html>
