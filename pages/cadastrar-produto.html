<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CA Tech - Cadastrar Produto</title>


    <link rel="stylesheet" href="../style/cadastrar-produto.css">


    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&display=swap" rel="stylesheet">


    <link rel="icon" type="image/png" href="/assets/logo-com-fundo.png">


</head>



<body>
<button 
    type="button"
    class="btn-voltar"
    onclick="voltarPagina()">

    ← Voltar

</button>


    <!-- MENU LATERAL -->

    <div class="sidebar">

        <!-- menu do lojista -->

    </div>





    <!-- CONTEÚDO -->

    <main class="conteudo">



        <section class="cadastraproduto">



            <!-- TOPO -->

            <header class="topo-cadastraproduto">


                <div>

                    <h1>
                        Cadastrar Produto
                    </h1>


                    <p>
                        Adicione um novo produto ao catálogo da sua loja.
                    </p>


                </div>



                <button class="btn-voltar">

                    ← Voltar

                </button>



            </header>






            <form id="formProduto">





                <!-- INFORMAÇÕES BÁSICAS -->

                <div class="secao">


                    <h2>
                        Informações do Produto
                    </h2>



                    <div class="campo">

                        <label>
                            Nome do Produto
                        </label>


                        <input 
                            type="text"
                            placeholder="Ex: SSD Kingston 480GB">

                    </div>





                    <div class="linha">


                        <div class="campo">

                            <label>
                                Categoria
                            </label>


                            <select>

                                <option>
                                    Selecione uma categoria
                                </option>

                                <option>
                                    Notebook
                                </option>

                                <option>
                                    Computadores
                                </option>

                                <option>
                                    Componentes
                                </option>

                                <option>
                                    Periféricos
                                </option>


                            </select>


                        </div>





                        <div class="campo">


                            <label>
                                Marca
                            </label>


                            <input 
                                type="text"
                                placeholder="Ex: Kingston">


                        </div>



                    </div>



                </div>









                <!-- PREÇOS -->

                <div class="secao">


                    <h2>
                        Valores e Estoque
                    </h2>



                    <div class="linha">



                        <div class="campo">


                            <label>
                                Preço
                            </label>


                            <input 
                                type="number"
                                placeholder="R$ 0,00">


                        </div>





                        <div class="campo">


                            <label>
                                Preço Promocional
                            </label>


                            <input 
                                type="number"
                                placeholder="R$ 0,00">


                        </div>



                    </div>





                    <div class="linha">



                        <div class="campo">

                            <label>
                                Estoque
                            </label>


                            <input 
                                type="number"
                                placeholder="Quantidade">


                        </div>





                        <div class="campo">

                            <label>
                                SKU
                            </label>


                            <input 
                                type="text"
                                placeholder="Código do produto">


                        </div>



                    </div>



                </div>









                <!-- DESCRIÇÃO -->

                <div class="secao">


                    <h2>
                        Descrição
                    </h2>



                    <div class="campo">


                        <textarea 
                            placeholder="Descreva detalhes técnicos do produto..."></textarea>


                    </div>



                </div>









                <!-- IMAGENS -->

                <div class="secao">


                    <h2>
                        Imagens do Produto
                    </h2>



                    <div class="linha">



                        <div class="campo">


                            <label>
                                Imagem Principal
                            </label>


                            <div class="upload">


                                <p>
                                    Selecione a imagem principal
                                </p>


                                <input 
                                    type="file">


                            </div>


                        </div>






                        <div class="campo">


                            <label>
                                Galeria de Imagens
                            </label>


                            <div class="upload">


                                <p>
                                    Adicione imagens adicionais
                                </p>


                                <input 
                                    type="file"
                                    multiple>


                            </div>


                        </div>




                    </div>



                </div>









                <!-- STATUS -->

                <div class="secao">


                    <h2>
                        Configurações
                    </h2>



                    <div class="campo">


                        <label>
                            Status do Produto
                        </label>


                        <select>


                            <option>
                                Ativo
                            </option>


                            <option>
                                Inativo
                            </option>


                        </select>


                    </div>



                </div>








                <!-- BOTÕES -->


                <div class="botoes">


                    <button 
                        type="button"
                        class="btn-cancelar">

                        Cancelar

                    </button>




                    <button 
                        type="submit"
                        class="btn-salvar">

                        Salvar Produto

                    </button>



                </div>






            </form>



        </section>



    </main>







<script src="../js/cadastrar-produto.js"></script>


</body>

</html>
