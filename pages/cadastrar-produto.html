<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CA Tech - Cadastrar Produto</title>


    <link rel="stylesheet" href="../style/cadastrar-produto.css">

</head>


<body>


  
<!-- ========================================= -->
<!-- CONTEÚDO -->
<!-- ========================================= -->


<main class="conteudo">


    <h1>Cadastrar Produto</h1>



    <form id="form-produto">



        <!-- ========================================= -->
        <!-- DADOS DO PRODUTO -->
        <!-- ========================================= -->


        <section class="card">


            <h2>Dados do Produto</h2>



            <!-- ========================================= -->
            <!-- NOME -->
            <!-- ========================================= -->


            <label for="nome">
                Nome do Produto
            </label>


            <input
                type="text"
                id="nome"
                placeholder="Digite o nome do produto"
            >




            <!-- ========================================= -->
            <!-- CÓDIGO -->
            <!-- ========================================= -->


            <label for="codigo">
                Código do Produto
            </label>


            <input
                type="text"
                id="codigo"
                placeholder="Ex: SSD001"
            >




            <!-- ========================================= -->
            <!-- DESCRIÇÃO -->
            <!-- ========================================= -->


            <label for="descricao">
                Descrição
            </label>


            <textarea
                id="descricao"
                placeholder="Descrição do produto"
            ></textarea>




            <!-- ========================================= -->
            <!-- CATEGORIA -->
            <!-- ========================================= -->


            <label for="novaCategoria">
                Nova Categoria
            </label>


            <div class="campo-cadastro">

                <input
                    type="text"
                    id="novaCategoria"
                    placeholder="Digite o nome da categoria"
                >


                <button
                    type="button"
                    id="btn-salvar-categoria"
                >
                    Salvar
                </button>

            </div>



            <label for="produtoCategoria">
                Categoria do Produto
            </label>


            <select id="produtoCategoria">

                <option value="">
                    Selecione uma categoria
                </option>

            </select>




            <!-- ========================================= -->
            <!-- MARCA -->
            <!-- ========================================= -->


            <label for="novaMarca">
                Nova Marca
            </label>


            <div class="campo-cadastro">

                <input
                    type="text"
                    id="novaMarca"
                    placeholder="Digite o nome da marca"
                >


                <button
                    type="button"
                    id="btn-salvar-marca"
                >
                    Salvar
                </button>

            </div>



            <label for="produtoMarca">
                Marca do Produto
            </label>


            <select id="produtoMarca">

                <option value="">
                    Selecione uma marca
                </option>

            </select>




            <!-- ========================================= -->
            <!-- COR -->
            <!-- ========================================= -->


            <label for="novaCor">
                Nova Cor
            </label>


            <div class="campo-cadastro">

                <input
                    type="text"
                    id="novaCor"
                    placeholder="Digite o nome da cor"
                >


                <button
                    type="button"
                    id="btn-salvar-cor"
                >
                    Salvar
                </button>

            </div>



            <label for="produtoCor">
                Cor do Produto
            </label>


            <select id="produtoCor">

                <option value="">
                    Selecione uma cor
                </option>

            </select>




            <!-- ========================================= -->
            <!-- TAMANHO -->
            <!-- ========================================= -->


            <label for="novoTamanho">
                Novo Tamanho
            </label>


            <div class="campo-cadastro">

                <input
                    type="text"
                    id="novoTamanho"
                    placeholder="Digite o tamanho"
                >


                <button
                    type="button"
                    id="btn-salvar-tamanho"
                >
                    Salvar
                </button>

            </div>



            <label for="produtoTamanho">
                Tamanho do Produto
            </label>


            <select id="produtoTamanho">

                <option value="">
                    Selecione um tamanho
                </option>

            </select>



        </section>







        <!-- ========================================= -->
        <!-- VALORES E ESTOQUE -->
        <!-- ========================================= -->


        <section class="card">


            <h2>Valores e Estoque</h2>



            <!-- PREÇO ANTIGO -->


            <label for="preco_antigo">
                Preço Antigo
            </label>


            <input
                type="number"
                step="1"
                id="preco_antigo"
                placeholder="R$ 0,00"
            >




            <!-- PREÇO PROMOCIONAL -->


            <label for="preco_promocional">
                Preço Promocional
            </label>


            <input
                type="number"
                step="0.01"
                id="preco_promocional"
                placeholder="R$ 0,00"
            >




            <!-- ESTOQUE -->


            <label for="quantidade_estoque">
                Quantidade em Estoque
            </label>


            <input
                type="number"
                id="quantidade_estoque"
                min="0"
                placeholder="Quantidade"
            >



        </section>







        <!-- ========================================= -->
        <!-- IMAGENS DO PRODUTO -->
        <!-- ========================================= -->


        <section class="card">


            <h2>Imagens do Produto</h2>



            <label for="midiasProduto">
                Selecionar Imagens
            </label>


            <input
                type="file"
                id="midiasProduto"
                accept="image/*"
                multiple
            >



            <small>
                Você pode selecionar várias imagens.
                Escolha uma delas como imagem principal.
            </small>



            <!-- ========================================= -->
            <!-- PRÉVIA DAS IMAGENS -->
            <!-- ========================================= -->


            <div id="preview-imagens">

                <!--
                    As imagens selecionadas
                    serão exibidas aqui pelo JS.
                -->

            </div>



        </section>







        <!-- ========================================= -->
        <!-- INFORMAÇÕES DA LOJA -->
        <!-- ========================================= -->


        <section class="card">


            <h2>Informações da Loja</h2>



            <label for="loja_idLoja">
                ID da Loja
            </label>


            <input
                type="number"
                id="loja_idLoja"
                placeholder="Digite o ID da loja"
            >



        </section>







        <!-- ========================================= -->
        <!-- STATUS E SALVAR -->
        <!-- ========================================= -->


        <div class="acoes">


            <button
                type="button"
                id="btn-status"
            >
                Produto Ativo
            </button>




            <button
                type="submit"
                id="btn-salvar"
            >
                Salvar Produto
            </button>



        </div>



    </form>



</main>





<!-- ========================================= -->
<!-- JAVASCRIPT -->
<!-- ========================================= -->


<script src="../js/cadastrar-produto.js"></script>


</body>

</html>
