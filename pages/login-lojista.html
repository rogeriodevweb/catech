<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Lojista - CA Tech</title>

    <link rel="stylesheet" href="../style/login-lojista.css">
     <!--imagem da logo pro navegador-->
    <link rel="icon" type="image/png" href="../assets/logo-com-fundo.png">
</head>


<body>


<div class="login-container">


    <div class="login-card">


        <h1>
            CA Tech
        </h1>


        <h2>
            Login do Lojista
        </h2>


        <p>
            Acesse o painel da sua loja
        </p>



        <form id="loginLojista">


            <div class="campo">

                <label>
                    E-mail
                </label>

                <input 
                    type="email" 
                    id="email"
                    placeholder="Digite seu e-mail"
                    required>

            </div>



            <div class="campo">

                <label>
                    Senha
                </label>

                <input 
                    type="password"
                    id="senha"
                    placeholder="Digite sua senha"
                    required>

            </div>



            <button type="submit">

                Entrar

            </button>



            <a href="cadastro-lojista.html">

                Ainda não sou lojista

            </a>




        </form>


    </div>


</div>



<script src="../js/login-lojista.js"></script>


</body>

</html>
