<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CA Tech | Cadastro da Loja</title>

    <link rel="stylesheet" href="../style/cadastrar-loja.css">

    <!-- Fonte Ubuntu -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">

</head>

<body>

<div class="container">

    <div class="card">

        <a href="../pages/cadastro-lojista-inicio.html" class="voltar">
            ← Voltar
        </a>

        <h1>Cadastrar Loja</h1>

        <p class="subtitulo">
            Cadastre sua empresa na plataforma CA Tech. Após o cadastro será gerado automaticamente um código da loja para vincular o lojista.
        </p>

        <form id="formLoja">

            <!-- ========================================= -->
            <!-- DADOS DA EMPRESA -->
            <!-- ========================================= -->

            <div class="secao">

                <h2>Dados da Empresa</h2>

                <div class="linha">

                    <div class="campo">
                        <label for="nome">Nome da Loja *</label>
                        <input type="text" id="nome" required>
                    </div>

                    <div class="campo">
                        <label for="razaoSocial">Razão Social *</label>
                        <input type="text" id="razaoSocial" required>
                    </div>

                </div>

                <div class="linha">

                    <div class="campo">
                        <label for="cnpj">CNPJ *</label>
                        <input type="text" id="cnpj" placeholder="00.000.000/0000-00" required>
                    </div>

                    <div class="campo">
                        <label for="inscricaoEstadual">Inscrição Estadual</label>
                        <input type="text" id="inscricaoEstadual">
                    </div>

                </div>

                <div class="linha">

                    <div class="campo">
                        <label for="fundacao">Data de Fundação</label>
                        <input type="date" id="fundacao">
                    </div>

                </div>

            </div>

            <!-- ========================================= -->
            <!-- CONTATO -->
            <!-- ========================================= -->

            <div class="secao">

                <h2>Contato</h2>

                <div class="linha">

                    <div class="campo">
                        <label for="email">E-mail Comercial *</label>
                        <input type="email" id="email" required>
                    </div>

                    <div class="campo">
                        <label for="telefone">Telefone *</label>
                        <input type="text" id="telefone" required>
                    </div>

                </div>

                <div class="linha">

                    <div class="campo">
                        <label for="whatsapp">WhatsApp</label>
                        <input type="text" id="whatsapp">
                    </div>

                    <div class="campo">
                        <label for="site">Site</label>
                        <input type="url" id="site">
                    </div>

                </div>

            </div>

            <!-- ========================================= -->
            <!-- REDES SOCIAIS -->
            <!-- ========================================= -->

            <div class="secao">

                <h2>Redes Sociais</h2>

                <div class="linha">

                    <div class="campo">
                        <label for="instagram">Instagram</label>
                        <input type="text" id="instagram">
                    </div>

                    <div class="campo">
                        <label for="facebook">Facebook</label>
                        <input type="text" id="facebook">
                    </div>

                </div>

                <div class="linha">

                    <div class="campo">
                        <label for="linkedin">LinkedIn</label>
                        <input type="text" id="linkedin">
                    </div>

                </div>

            </div>

            <!-- ========================================= -->
            <!-- ENDEREÇO -->
            <!-- ========================================= -->

            <div class="secao">

                <h2>Endereço Comercial</h2>

                <div class="linha">

                    <div class="campo">
                        <label for="cep">CEP *</label>
                        <input type="text" id="cep" required>
                    </div>

                    <div class="campo">
                        <label for="estado">Estado *</label>
                        <input type="text" id="estado" required>
                    </div>

                </div>

                <div class="linha">

                    <div class="campo">
                        <label for="cidade">Cidade *</label>
                        <input type="text" id="cidade" required>
                    </div>

                    <div class="campo">
                        <label for="bairro">Bairro *</label>
                        <input type="text" id="bairro" required>
                    </div>

                </div>

                <div class="linha">

                    <div class="campo">
                        <label for="rua">Rua *</label>
                        <input type="text" id="rua" required>
                    </div>

                    <div class="campo pequeno">
                        <label for="numero">Número *</label>
                        <input type="text" id="numero" required>
                    </div>

                </div>

                <div class="linha">

                    <div class="campo">
                        <label for="complemento">Complemento</label>
                        <input type="text" id="complemento">
                    </div>

                </div>

            </div>

            <!-- ========================================= -->
            <!-- SOBRE A LOJA -->
            <!-- ========================================= -->

            <div class="secao">

                <h2>Sobre a Loja</h2>

                <div class="campo">

                    <label for="descricao">Descrição</label>

                    <textarea
                        id="descricao"
                        rows="6"
                        placeholder="Conte um pouco sobre sua empresa..."></textarea>

                </div>

                <div class="linha">

                    <div class="campo">

                        <label for="logo">Logo da Loja</label>

                        <input
                            type="file"
                            id="logo"
                            accept="image/*">

                    </div>


                </div>

            </div>
            <!-- ========================================= -->
            <!-- BOTÃO CADASTRAR -->
            <!-- ========================================= -->

            <button type="submit" id="btnCadastrarLoja">
    Cadastrar Loja
</button>

        </form>

    </div>

</div>

<script src="../js/cadastrar-loja.js"></script>

</body>

</html>
