<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CA Tech</title>

<link rel="stylesheet" href="/style/cadastro.css">

<!-- Fonte Ubuntu -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&display=swap" rel="stylesheet">

<!-- Font Awesome -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="icon" type="image/png" href="/assets/logo-com-fundo.png">

</head>

<body>

<div class="container">

    <div class="left">

        <img src="/assets/tela-login-cadastro.png" alt="Cadastro">

    </div>

    <div class="right">

        <form id="cadastroForm">

            <h1>CADASTRO</h1>

            <div class="input-box">
                <label>Nome Completo</label>
                <input
                    type="text"
                    id="nome"
                    placeholder="Digite seu nome completo"
                    required>
            </div>

            <div class="input-box">
                <label>CPF</label>
                <input
                    type="text"
                    id="cpf"
                    placeholder="000.000.000-00"
                    maxlength="14"
                    required>
            </div>

            <div class="input-box">
                <label>Telefone</label>
                <input
                    type="tel"
                    id="telefone"
                    placeholder="(00) 00000-0000"
                    maxlength="15"
                    required>
            </div>

            <div class="input-box">
                <label>E-mail</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Digite seu e-mail"
                    required>
            </div>

            <div class="input-box">
                <label>Data de Nascimento</label>
                <input
                    type="date"
                    id="dataNascimento"
                    required>
            </div>

            <div class="input-box">
                <label>Senha</label>
                <input
                    type="password"
                    id="senha"
                    placeholder="********"
                    required>
            </div>

            <div class="input-box">
                <label>Confirmar Senha</label>
                <input
                    type="password"
                    id="confirmarSenha"
                    placeholder="********"
                    required>
            </div>

            <button id="btn-criar-conta" type="submit">
                Cadastrar
            </button>

            <p class="login">
                Já possui uma conta?
                <a href="/pages/login.html">Entrar</a>
            </p>

        </form>

    </div>

</div>

<script src="/js/cadastro.js"></script>

</body>
</html>
