<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastrar Cupom | CA Tech</title>

    <link rel="stylesheet" href="/style/cadastrarcupom.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&display=swap" rel="stylesheet">

</head>

<body>

    <!-- MENU LATERAL -->

    <div class="sidebar">

        <!-- Menu do lojista -->

    </div>



    <!-- CONTEÚDO -->

    <main class="conteudo">

        <!-- BOTÃO VOLTAR -->

        <div class="area-voltar">

            <button
                type="button"
                class="btn-voltar"
                onclick="history.back()">

                ← Voltar

            </button>

        </div>



        <section class="cadastro-cupom">



            <!-- TOPO -->

            <header class="topo-cupom">

                <div>

                    <h1>

                        Cadastrar Cupom

                    </h1>

                    <p>

                        Crie cupons promocionais para oferecer descontos aos seus clientes.

                    </p>

                </div>

            </header>



            <form id="formCupom">

                <!-- DADOS DO CUPOM -->

                <div class="secao">

                    <h2>

                        Informações do Cupom

                    </h2>

                    <div class="linha">

                        <div class="campo">

                            <label>

                                Nome do Cupom

                            </label>

                            <input
                                type="text"
                                id="nomeCupom"
                                placeholder="Ex: Promoção de Inverno">

                        </div>

                        <div class="campo">

                            <label>

                                Código do Cupom

                            </label>

                            <input
                                type="text"
                                id="codigoCupom"
                                placeholder="Ex: INVERNO20">

                        </div>

                    </div>

                    <div class="campo">

                        <label>

                            Descrição

                        </label>

                        <textarea
                            id="descricaoCupom"
                            placeholder="Descrição do cupom (opcional)"></textarea>

                    </div>

                </div>



                <!-- DESCONTO -->

                <div class="secao">

                    <h2>

                        Configuração do Desconto

                    </h2>

                    <div class="linha">

                        <div class="campo">

                            <label>

                                Tipo de Desconto

                            </label>

                            <select id="tipoDesconto">

                                <option value="porcentagem">

                                    Porcentagem (%)

                                </option>

                                <option value="valor">

                                    Valor Fixo (R$)

                                </option>

                            </select>

                        </div>

                        <div class="campo">

                            <label>

                                Valor do Desconto

                            </label>

                            <input
                                type="number"
                                id="valorDesconto"
                                min="0"
                                step="0.01"
                                placeholder="0">

                        </div>

                    </div>

                    <div class="linha">

                        <div class="campo">

                            <label>

                                Valor Mínimo da Compra

                            </label>

                            <input
                                type="number"
                                id="valorMinimo"
                                min="0"
                                step="0.01"
                                placeholder="0">

                        </div>

                        <div class="campo">

                            <label>

                                Limite de Utilizações

                            </label>

                            <input
                                type="number"
                                id="limiteUso"
                                min="1"
                                placeholder="100">

                        </div>

                    </div>

                    <div class="campo">

                        <label>

                            Limite por Cliente

                        </label>

                        <input
                            type="number"
                            id="limiteCliente"
                            min="1"
                            value="1">

                    </div>

                </div>



                <!-- VALIDADE -->

                <div class="secao">

                    <h2>

                        Validade

                    </h2>

                    <div class="linha">

                        <div class="campo">

                            <label>

                                Data de Início

                            </label>

                            <input
                                type="date"
                                id="dataInicio">

                        </div>

                        <div class="campo">

                            <label>

                                Data de Expiração

                            </label>

                            <input
                                type="date"
                                id="dataFim">

                        </div>

                    </div>

                </div>



                <!-- CONFIGURAÇÕES -->

                <div class="secao">

                    <h2>

                        Configurações

                    </h2>

                    <div class="linha">

                        <div class="campo">

                            <label>

                                Categoria

                            </label>

                            <select id="categoria">

                                <option value="">

                                    Todas as Categorias

                                </option>

                                <option>

                                    Componentes

                                </option>

                                <option>

                                    Notebooks

                                </option>

                                <option>

                                    Periféricos

                                </option>

                                <option>

                                    Acessórios

                                </option>

                            </select>

                        </div>

                        <div class="campo">

                            <label>

                                Status

                            </label>

                            <select id="status">

                                <option value="ativo">

                                    Ativo

                                </option>

                                <option value="inativo">

                                    Inativo

                                </option>

                            </select>

                        </div>

                    </div>

                </div>



                <!-- BOTÕES -->

                <div class="botoes">

                    <button
                        type="reset"
                        class="btn-cancelar">

                        Cancelar

                    </button>

                    <button
                        type="submit"
                        class="btn-salvar">

                        Salvar Cupom

                    </button>

                </div>

            </form>

        </section>

    </main>

    <script src="/js/cadastrarcupom.js"></script>

</body>

</html>
