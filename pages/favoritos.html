<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Favoritos | CA Tech</title>

    <!-- CSS -->
    <link rel="stylesheet" href="/style/favoritos.css">

    <!-- Fonte Ubuntu -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&display=swap" rel="stylesheet">

    <!-- Ícone da aba -->
    <link rel="icon" type="image/png" href="/assets/logo-com-fundo.png">

</head>

<body>

<div class="favoritos">

    <div class="topo-favoritos">

        <button class="btn-voltar">
            ← Voltar
        </button>

        <div>
            <h1>❤️ Meus Favoritos</h1>
            <p>Todos os produtos salvos por você.</p>
        </div>

    </div>

    <div class="lista-favoritos">

        <div class="card-produto">

            <img src="../img/sem-imagem.png" alt="Produto">

            <h2>Produto Exemplo</h2>

            <span class="preco">
                R$ 79,90
            </span>

            <div class="acoes">

                <button class="btn-carrinho">
                    Adicionar ao Carrinho
                </button>

                <button class="btn-remover">
                    Remover
                </button>

            </div>

        </div>

    </div>

</div>

<script src="../js/favoritos.js"></script>

</body>

</html>
