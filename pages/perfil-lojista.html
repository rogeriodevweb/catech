<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Perfil do Lojista</title>

    <link rel="stylesheet" href="../STYLE/perfil-lojista.css">

</head>

<body>

<div class="container">

    <div class="perfil-card">

        <h1>Perfil do Lojista</h1>
        <p class="subtitulo">
            Gerencie as informações da sua loja.
        </p>

        <div class="foto-area">

            <div class="foto">
                👤
            </div>

            <button id="trocarFoto">
                Alterar Foto
            </button>

        </div>

        <div class="formulario">

            <div class="campo">
                <label>Nome da Loja</label>
                <input type="text" id="loja">
            </div>

            <div class="campo">
                <label>Responsável</label>
                <input type="text" id="responsavel">
            </div>

            <div class="campo">
                <label>E-mail</label>
                <input type="email" id="email">
            </div>

            <div class="campo">
                <label>Telefone</label>
                <input type="text" id="telefone">
            </div>

            <div class="campo">
                <label>CNPJ</label>
                <input type="text" id="cnpj">
            </div>

            <div class="campo">
                <label>Endereço</label>
                <input type="text" id="endereco">
            </div>

            <div class="campo">
                <label>Site</label>
                <input type="text" id="site">
            </div>

            <div class="campo">
                <label>Instagram</label>
                <input type="text" id="instagram">
            </div>

            <div class="campo">
                <label>Facebook</label>
                <input type="text" id="facebook">
            </div>

            <div class="campo">
                <label>Chave PIX</label>
                <input type="text" id="pix">
            </div>

        </div>

        <div class="rodape">

            <span>
                Data de Cadastro:
                <strong>09/07/2026</strong>
            </span>

            <button id="salvar">
                Salvar Alterações
            </button>

        </div>

    </div>

</div>

<script src="../JS/perfil-lojista.js"></script>

</body>
</html>
