<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aparência - CA Tech</title>

    <link rel="stylesheet" href="../style/aparencia-c.css">
</head>

<body>


<div class="container-aparencia">


    <!-- Cabeçalho -->

    <div class="cabecalho">

        <h1>Aparência</h1>

        <p>
            Personalize como a CA Tech aparece para você.
        </p>
        <button class="btn-voltar" onclick="voltarPagina()">
    ← Voltar
</button>
    </div>




    <!-- Tema -->

    <section class="config-card">

        <div class="titulo-config">

            <span>🎨</span>

            <div>

                <h2>Tema</h2>

                <p>
                    Escolha o modo de visualização da plataforma.
                </p>

            </div>

        </div>


        <div class="opcoes">

            <label class="opcao">

                <input type="radio" name="tema" value="claro">

                <span>
                    ☀️ Claro
                </span>

            </label>


            <label class="opcao">

                <input type="radio" name="tema" value="escuro">

                <span>
                    🌙 Escuro
                </span>

            </label>



            <label class="opcao">

                <input type="radio" name="tema" value="automatico">

                <span>
                    ⚙️ Automático
                </span>

            </label>


        </div>

    </section>







    <!-- Cor -->

    <section class="config-card">


        <div class="titulo-config">

            <span>🖌️</span>


            <div>

                <h2>Cor da interface</h2>

                <p>
                    Escolha a cor principal da loja.
                </p>

            </div>


        </div>



        <div class="cores">


            <button class="cor azul"></button>

            <button class="cor roxo"></button>

            <button class="cor verde"></button>

            <button class="cor vermelho"></button>


        </div>


    </section>








    <!-- Fonte -->

    <section class="config-card">


        <div class="titulo-config">

            <span>🔠</span>


            <div>

                <h2>Tamanho da fonte</h2>

                <p>
                    Ajuste o tamanho dos textos.
                </p>

            </div>


        </div>



        <select id="tamanhoFonte">


            <option value="pequena">
                Pequena
            </option>


            <option value="media" selected>
                Média
            </option>


            <option value="grande">
                Grande
            </option>


        </select>


    </section>









    <!-- Exibição -->

    <section class="config-card">


        <div class="titulo-config">

            <span>⚡</span>


            <div>

                <h2>Preferências de exibição</h2>

                <p>
                    Controle elementos visuais.
                </p>

            </div>


        </div>




        <label class="switch-item">

            <span>
                Mostrar imagens dos produtos
            </span>

            <input type="checkbox" checked>

        </label>



        <label class="switch-item">

            <span>
                Ativar animações
            </span>

            <input type="checkbox" checked>

        </label>



        <label class="switch-item">

            <span>
                Modo econômico
            </span>

            <input type="checkbox">

        </label>



    </section>






    <button class="btn-salvar">

        Salvar alterações

    </button>



</div>



<script src="../js/aparencia-c.js"></script>

</body>

</html>
