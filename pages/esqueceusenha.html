<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Esqueceu a Senha</title>

    <link rel="stylesheet" href="/style/esqueceuSenha.css">

    <!-- Fonte Ubuntu -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!--imagem da logo pro navegador-->
<link rel="icon" type="image/png" href="/assets/logo-com-fundo.png">
</head>

<body>

<div class="container">

    <div class="left">

        <img src="/assets/senha-recuperar.jpg" alt="Esqueceu Senha">

    </div>

    <div class="right">

        <form id="recuperarForm">

            <h1>RECUPERAR SENHA</h1>

            <p class="descricao">
                Digite seu e-mail para receber o link de recuperação.
            </p>

            <div class="input-box">

                <label>E-mail</label>

                <input
                type="email"
                id="email"
                placeholder="Digite seu e-mail"
                required>

            </div>

            <button type="submit">
                Enviar Link
            </button>

            <p class="voltar">

                Lembrou sua senha?

                <a href="/html/login.html">
                    Fazer Login
                </a>

            </p>

        </form>

    </div>

</div>

<script src="/script/esqueceuSenha.js"></script>

</body>
</html>
