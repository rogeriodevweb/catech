<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu Perfil | CA Tech</title>

    <!-- CSS -->
    <link rel="stylesheet" href="../style/perfil-cliente.css">

    <!-- Ícones -->
    <link 
        rel="stylesheet" 
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
                       <!--imagem da logo pro navegador-->
<link rel="icon" type="image/png" href="/assets/logo-com-fundo.png">
</head>


<body>


    <!-- ===========================
         CONTAINER PRINCIPAL
    ============================ -->

    <main class="pagina">


        <!-- ===========================
             CABEÇALHO
        ============================ -->

        <header class="cabecalho">


            <button class="btn-voltar" onclick="history.back()">

                <i class="fa-solid fa-arrow-left"></i>

                Voltar

            </button>


            <div class="titulo">

                <h1>
                    Meu Perfil
                </h1>

                <p>
                    Gerencie suas informações pessoais
                </p>

            </div>


        </header>



        <!-- ===========================
             CARD PERFIL
        ============================ -->


        <section class="card perfil">


           <div class="foto-container">

            <img 
                id="fotoPerfil"
                src="../assets/perfil.png"
                alt="Foto do cliente"
                >

             <button id="alterarFoto">

                <i class="fa-solid fa-camera"></i>

                Alterar Foto

                </button>

            </div>



            <div class="dados-resumo">


                <h2 id="nomeCliente">
                    Nome do Cliente
                </h2>


                <p id="emailCliente">
                    email@email.com
                </p>


            </div>


        </section>




        <!-- ===========================
             DADOS PESSOAIS
        ============================ -->


        <section class="card">


            <div class="titulo-card">


                <i class="fa-solid fa-user"></i>


                <h2>
                    Dados Pessoais
                </h2>


            </div>



            <div class="form-grid">


                <div class="campo">


                    <label>
                        Nome Completo
                    </label>


                    <input 
                        type="text"
                        id="nome"
                    >


                </div>




                <div class="campo">


                    <label>
                        CPF
                    </label>


                    <input 
                        type="text"
                        id="cpf"
                    >


                </div>





                <div class="campo">


                    <label>
                        Data de Nascimento
                    </label>


                    <input 
                        type="date"
                        id="dataNascimento"
                    >


                </div>




                <div class="campo">


                    <label>
                        Sexo
                    </label>


                    <select id="sexo">


                        <option value="">
                            Selecione
                        </option>


                        <option>
                            Masculino
                        </option>


                        <option>
                            Feminino
                        </option>


                        <option>
                            Outro
                        </option>


                    </select>


                </div>



            </div>



        </section>

        
        <!-- ===========================
             CONTATO
        ============================ -->


        <section class="card">


            <div class="titulo-card">


                <i class="fa-solid fa-phone"></i>


                <h2>
                    Contato
                </h2>


            </div>



            <div class="form-grid">


                <div class="campo">


                    <label>
                        E-mail
                    </label>


                    <input
                        type="email"
                        id="email"
                    >


                </div>





                <div class="campo">


                    <label>
                        Celular
                    </label>


                    <input
                        type="text"
                        id="celular"
                    >


                </div>





                <div class="campo">


                    <label>
                        Telefone
                    </label>


                    <input
                        type="text"
                        id="telefone"
                    >


                </div>



            </div>


        </section>






        <!-- ===========================
             ENDEREÇO
        ============================ -->


        <section class="card">


            <div class="titulo-card">


                <i class="fa-solid fa-location-dot"></i>


                <h2>
                    Endereço
                </h2>


            </div>





            <div class="form-grid">



                <div class="campo">


                    <label>
                        CEP
                    </label>


                    <input
                        type="text"
                        id="cep"
                    >


                </div>





                <div class="campo">


                    <label>
                        Rua
                    </label>


                    <input
                        type="text"
                        id="rua"
                    >


                </div>





                <div class="campo">


                    <label>
                        Número
                    </label>


                    <input
                        type="text"
                        id="numero"
                    >


                </div>





                <div class="campo">


                    <label>
                        Complemento
                    </label>


                    <input
                        type="text"
                        id="complemento"
                    >


                </div>





                <div class="campo">


                    <label>
                        Bairro
                    </label>


                    <input
                        type="text"
                        id="bairro"
                    >


                </div>





                <div class="campo">


                    <label>
                        Cidade
                    </label>


                    <input
                        type="text"
                        id="cidade"
                    >


                </div>





                <div class="campo">


                    <label>
                        Estado
                    </label>



                    <select id="estado">


                        <option value="">
                            Selecione
                        </option>


                        <option>
                            AC
                        </option>

                        <option>
                            AL
                        </option>

                        <option>
                            AP
                        </option>

                        <option>
                            AM
                        </option>

                        <option>
                            BA
                        </option>

                        <option>
                            CE
                        </option>

                        <option>
                            DF
                        </option>

                        <option>
                            ES
                        </option>

                        <option>
                            GO
                        </option>

                        <option>
                            MA
                        </option>

                        <option>
                            MT
                        </option>

                        <option>
                            MS
                        </option>

                        <option>
                            MG
                        </option>

                        <option>
                            PA
                        </option>

                        <option>
                            PB
                        </option>

                        <option>
                            PR
                        </option>

                        <option>
                            PE
                        </option>

                        <option>
                            PI
                        </option>

                        <option>
                            RJ
                        </option>

                        <option>
                            RN
                        </option>

                        <option>
                            RS
                        </option>

                        <option>
                            RO
                        </option>

                        <option>
                            RR
                        </option>

                        <option>
                            SC
                        </option>

                        <option>
                            SP
                        </option>

                        <option>
                            SE
                        </option>

                        <option>
                            TO
                        </option>


                    </select>



                </div>




            </div>



        </section>

        
        <!-- ===========================
             AÇÕES
        ============================ -->


        <div class="acoes">


            <button 
                class="btn-salvar"
                id="salvarPerfil"
            >


                <i class="fa-solid fa-floppy-disk"></i>


                Salvar Alterações


            </button>



        </div>



    </main>





    <!-- ===========================
         JAVASCRIPT
    ============================ -->


    <script src="../js/perfil-cliente.js"></script>



</body>

</html>
