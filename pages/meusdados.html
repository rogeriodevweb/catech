<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meus Dados</title>
    <title>CA Tech</title>
    <link rel="stylesheet" href="style/index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="/style/meusdados.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"
     rel="stylesheet">
     <link rel="icon" type="image/png" href="/assets/logo-com-fundo.png">
</head>

<body>

    <div class="perfil-cliente">
<div class="voltar">

    <button type="button" class="btn-voltar" onclick="history.back()">
        ← Voltar
    </button>

</div>
        <div class="titulo-perfil">
            <h2>Meus Dados</h2>
            <p>Mantenha suas informações sempre atualizadas.</p>
        </div>

        <form id="formPerfil">

            <div class="campo">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" placeholder="Digite seu nome completo">
            </div>

            <div class="linha">

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="Digite seu e-mail">
                </div>

                <div class="campo">
                    <label for="telefone">Telefone</label>
                    <input type="text" id="telefone" placeholder="(99) 99999-9999">
                </div>

            </div>

            <div class="linha">

                <div class="campo">
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" placeholder="000.000.000-00">
                </div>

                <div class="campo">
                    <label for="nascimento">Data de Nascimento</label>
                    <input type="date" id="nascimento">
                </div>

            </div>

            <hr>

            <div class="campo">

                <label for="cep">CEP</label>

                <div class="grupo-cep">
                    <input type="text" id="cep" placeholder="00000-000">
                    <button type="button" id="buscarCep">Buscar CEP</button>
                </div>

            </div>

            <div class="campo">
                <label for="endereco">Endereço</label>
                <input type="text" id="endereco">
            </div>

            <div class="linha">

                <div class="campo numero">
                    <label for="numero">Número</label>
                    <input type="text" id="numero">
                </div>

                <div class="campo">
                    <label for="complemento">Complemento</label>
                    <input type="text" id="complemento">
                </div>

            </div>

            <div class="campo">
                <label for="bairro">Bairro</label>
                <input type="text" id="bairro">
            </div>

            <div class="linha">

                <div class="campo">
                    <label for="cidade">Cidade</label>
                    <input type="text" id="cidade">
                </div>

                <div class="campo">
                    <label for="estado">Estado</label>

                    <select id="estado">
                        <option value="">Selecione</option>
                        <option>AC</option>
                        <option>AL</option>
                        <option>AP</option>
                        <option>AM</option>
                        <option>BA</option>
                        <option>CE</option>
                        <option>DF</option>
                        <option>ES</option>
                        <option>GO</option>
                        <option>MA</option>
                        <option>MT</option>
                        <option>MS</option>
                        <option>MG</option>
                        <option>PA</option>
                        <option>PB</option>
                        <option>PR</option>
                        <option>PE</option>
                        <option>PI</option>
                        <option>RJ</option>
                        <option>RN</option>
                        <option>RS</option>
                        <option>RO</option>
                        <option>RR</option>
                        <option>SC</option>
                        <option>SP</option>
                        <option>SE</option>
                        <option>TO</option>
                    </select>

                </div>

            </div>

            <div class="opcoes">

                <label>
                    <input type="checkbox">
                    Receber ofertas por e-mail
                </label>

                <label>
                    <input type="checkbox">
                    Receber promoções pelo WhatsApp
                </label>

            </div>

            <div class="botoes">

                <button type="submit" class="btn-salvar">
                    Salvar Alterações
                </button>

                <button type="button" class="btn-sair">
                    Encerrar Sessão
                </button>

            </div>

        </form>

    </div>

    <!-- JavaScript -->
    <script src="js/meusdados.js"></script>

</body>

</html>
